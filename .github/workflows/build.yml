name: Wrapline build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Wrapline build id
        required: true
      platform:
        description: android or ios
        required: true
      config:
        description: JSON build config from Wrapline
        required: true

permissions:
  contents: read
  id-token: write

env:
  CONFIG: ${{ inputs.config }}

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm install
      - run: node scripts/report.mjs status running "Runner picked up the Android build"

      - run: node scripts/configure.mjs
      - run: node scripts/report.mjs log "Generating Capacitor Android project"
      - run: npx cap add android
      - run: node scripts/android-native.mjs

      - name: Configure push notifications
        run: |
          set -e
          GS_URL=$(node -e "console.log(JSON.parse(process.env.CONFIG).google_services_url || '')")
          if [ -n "$GS_URL" ]; then
            curl -sSL "$GS_URL" -o android/app/google-services.json
            node scripts/report.mjs log "Bundling Firebase Cloud Messaging"
          fi
          node scripts/android-push.mjs

      - name: Prepare keystore
        run: |
          set -e
          KEYSTORE_URL=$(node -e "console.log(JSON.parse(process.env.CONFIG).keystore_url || '')")
          if [ -n "$KEYSTORE_URL" ]; then
            curl -sSL "$KEYSTORE_URL" -o "$RUNNER_TEMP/release.jks"
            echo "Using the uploaded keystore"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -alias wrapline -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass wrapline -keypass wrapline \
              -dname "CN=Wrapline, OU=Build, O=Wrapline, C=US"
            echo "Generated a fresh keystore"
          fi

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'wrapline' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'wrapline' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'wrapline' }}
        run: |
          node scripts/report.mjs log "Running gradle assembleRelease"
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload artifact to Wrapline
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          node scripts/report.mjs upload "$APK" apk
          node scripts/report.mjs status succeeded "Android build finished"

      - name: Report failure
        if: failure()
        run: node scripts/report.mjs status failed "Android build failed — see the runner logs"

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: node scripts/report.mjs status running "Runner picked up the iOS build"

      - run: node scripts/configure.mjs
      - run: npx cap add ios

      - name: Import Apple signing assets
        run: |
          set -e
          CERT_URL=$(node -e "console.log(JSON.parse(process.env.CONFIG).certificate_url || '')")
          PROFILE_URL=$(node -e "console.log(JSON.parse(process.env.CONFIG).provisioning_profile_url || '')")
          if [ -z "$CERT_URL" ] || [ -z "$PROFILE_URL" ]; then
            node scripts/report.mjs status failed "Apple certificate and provisioning profile are required"
            exit 1
          fi
          curl -sSL "$CERT_URL" -o "$RUNNER_TEMP/cert.p12"
          curl -sSL "$PROFILE_URL" -o "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p wrapline build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p wrapline build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k wrapline build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive and export IPA
        run: |
          set -e
          TEAM_ID=$(node -e "console.log(JSON.parse(process.env.CONFIG).team_id || '')")
          node scripts/report.mjs log "Running xcodebuild archive"
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload artifact to Wrapline
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n1)
          node scripts/report.mjs upload "$IPA" ipa
          node scripts/report.mjs status succeeded "iOS build finished"

      - name: Report failure
        if: failure()
        run: node scripts/report.mjs status failed "iOS build failed — see the runner logs"